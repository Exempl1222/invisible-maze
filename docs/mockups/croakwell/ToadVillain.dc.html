<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["idle","cast","gloat","sulk"],"default":"idle"},"magic":{"editor":"color","default":"#c9a6ff","options":["#c9a6ff","#e4ff7a","#8fe3ff","#ff9e7a"]},"$preview":{"width":390,"height":724}}'>
class Component extends DCLogic {
renderVals() {
const moods = {
idle:  { dy: 0,   hat: 'rotate(-6 195 540)',                 tip: 'rotate(0 207 456)',   L: [70, 352, -6],  R: [320, 352, 6],   glow: 0.45, cast: 0, flyIdle: 1, gloat: 0, sulk: 0, sac: [0, 0],   lid: 0 },
cast:  { dy: -8,  hat: 'translate(0 -10) rotate(5 195 540)', tip: 'rotate(-25 207 456)', L: [30, 318, -32], R: [360, 318, 32],  glow: 1,    cast: 1, flyIdle: 0, gloat: 0, sulk: 0, sac: [14, 10], lid: 0 },
gloat: { dy: -16, hat: 'translate(0 -14) rotate(-16 195 540)', tip: 'rotate(-40 207 456)', L: [34, 296, -14], R: [328, 358, 10], glow: 0.7,  cast: 0, flyIdle: 0, gloat: 1, sulk: 0, sac: [24, 18], lid: 0 },
sulk:  { dy: 34,  hat: 'translate(0 16) rotate(12 195 540)', tip: 'rotate(85 207 456)',  L: [44, 560, 190], R: [346, 560, 170], glow: 0,    cast: 0, flyIdle: 0, gloat: 0, sulk: 1, sac: [0, 0],   lid: 1 }
};
const m = moods[this.props.mood] || moods.idle;
const shY = 610 + m.dy;
const arm = (sx, hx, hy, side) => {
const cx = (sx + hx) / 2 + side * 40;
const cy = (shY + hy) / 2;
return 'M' + sx + ' ' + shY + ' Q' + cx + ' ' + cy + ' ' + hx + ' ' + hy;
};
const tipOf = (h) => {
const r = h[2] * Math.PI / 180;
return [h[0] + 32 * Math.sin(r), h[1] - 32 * Math.cos(r)];
};
const fl = tipOf(m.L), fr = tipOf(m.R);
const trail = (f, tx, ty) => 'M' + f[0].toFixed(1) + ' ' + f[1].toFixed(1) + ' Q' + ((f[0] + tx) / 2).toFixed(1) + ' ' + (Math.min(f[1], ty) - 60).toFixed(1) + ' ' + tx + ' ' + ty;
const lid = (cx) => m.lid ? 'M' + (cx - 31) + ' 550 A31 31 0 0 1 ' + (cx + 31) + ' 550 Z' : 'M0 0 Z';
return {
magic: this.props.magic ?? '#c9a6ff',
headT: 'translate(0 ' + (m.dy - 30) + ')',
hatT: m.hat,
tipT: m.tip,
armL: arm(104, m.L[0], m.L[1], -1),
armR: arm(286, m.R[0], m.R[1], 1),
handL: 'translate(' + m.L[0] + ' ' + m.L[1] + ') rotate(' + m.L[2] + ')',
handR: 'translate(' + m.R[0] + ' ' + m.R[1] + ') rotate(' + m.R[2] + ') scale(-1 1)',
trailL: trail(fl, 236, 296),
trailR: trail(fr, 252, 298),
glowOp: m.glow,
castOp: m.cast,
flyIdleOp: m.flyIdle,
gloatOp: m.gloat,
sulkOp: m.sulk,
cushionOp: m.sulk ? 0 : 1,
flatOp: m.sulk,
sacRx: m.sac[0],
sacRy: m.sac[1],
lidL: lid(145),
lidR: lid(245)
};
}
}
