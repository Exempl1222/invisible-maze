<script type="text/x-dc" data-dc-script data-props='{"pose":{"editor":"enum","options":["smug","point"],"default":"smug"},"look":{"editor":"enum","options":["left","center","right"],"default":"center"},"$preview":{"width":390,"height":460}}'>
class Component extends DCLogic {
renderVals() {
const pose = this.props.pose === 'point' ? 'point' : 'smug';
const look = this.props.look || 'center';
const px = look === 'left' ? -9 : look === 'right' ? 9 : 0;
const py = look === 'center' ? 0 : 5;
const r = 40, cy = 186;
const pt = (cx, deg) => {
const a = deg * Math.PI / 180;
return [(cx + r * Math.cos(a)).toFixed(1), (cy + r * Math.sin(a)).toFixed(1)];
};
const lid = (cx, a1, a2) => {
const p1 = pt(cx, a1), p2 = pt(cx, a2);
const span = ((a2 - a1) % 360 + 360) % 360;
const large = span > 180 ? 1 : 0;
return 'M' + p1[0] + ' ' + p1[1] + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p2[0] + ' ' + p2[1] + ' Z';
};
const smug = pose === 'smug';
return {
smugOp: smug ? 1 : 0,
pointOp: smug ? 0 : 1,
pupilLx: 128 + px,
pupilRx: 262 + px,
pupilY: 188 + py,
lidL: smug ? 'M88 186 A40 40 0 1 1 168 186 A40 40 0 1 1 88 186 Z' : lid(128, 222, 318),
lidR: smug ? lid(262, 212, 328) : lid(262, 222, 318),
hiLx: 120 + px, hiRx: 254 + px, hiY: 179 + py,
hi2Lx: 137 + px, hi2Rx: 271 + px, hi2Y: 196 + py
};
}
}
