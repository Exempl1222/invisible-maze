<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["a","b","c","d"],"default":"a"},"$preview":{"width":390,"height":260}}'>
class Component extends DCLogic {
renderVals() {
const tipUp = 'M203 0 c5 -11 16 -11 16 -1 c0 8 -10 8 -8 0 c2 -10 15 -11 18 -1';
const tipFlop = 'M203 0 c6 4 10 14 6 22 c-3 6 -9 3 -6 -2 c3 -6 10 -2 9 6';
const V = {
a: { label: 'Limp slump: hands let go and droop halfway, hat slides over his eyes', dy: 8, head: 'translate(0 4) rotate(4 195 52)', hat: 'translate(6 12) rotate(26 195 42)', tip: tipFlop, pom: [212, 28], L: [96, 50, 104, 205], R: [294, 340, 104, 155], hatOn: 1, hatOff: 0, cloud: 1, rats: 'Rats.', rs: 20, stress: 0, sigh: 0, scribble: 0 },
b: { label: 'Head in hands: clutching his eye bulges, hat squashed', dy: 4, head: '', hat: 'translate(195 46) scale(1.12 0.78) translate(-195 -42)', tip: tipFlop, pom: [212, 28], L: [96, 134, 46, 48], R: [294, 256, 46, -48], hatOn: 1, hatOff: 0, cloud: 0, rats: 'RATS!', rs: 24, stress: 1, sigh: 0, scribble: 0 },
c: { label: 'Hat off: shakes a fist up at the board, other arm dangles, hat fallen beside him with the snail', dy: 14, head: 'translate(0 2)', hat: '', tip: tipUp, pom: [229, -1], L: [96, 72, 62, 0], R: [294, 322, 114, 168], hatOn: 0, hatOff: 1, cloud: 1, rats: '', rs: 26, stress: 0, sigh: 0, scribble: 0, fist: 1, bubble: 1, noPf: 1 },
d: { label: 'Sheepish: one hand rubs the back of his head, the other hangs limp', dy: 6, head: 'rotate(-3 195 52)', hat: 'translate(6 4) rotate(-14 195 42)', tip: tipFlop, pom: [212, 28], L: [96, 170, 62, 18], R: [294, 340, 106, 158], hatOn: 1, hatOff: 0, cloud: 0, rats: 'Rats.', rs: 20, stress: 0, sigh: 0, scribble: 1 }
};
const v = V[this.props.variant] || V.a;
const sy = 106;
const arm = (sx, hx, hy, side) => 'M' + sx + ' ' + sy + ' Q' + ((sx + hx) / 2 + side * 18) + ' ' + ((sy + hy) / 2 - 10) + ' ' + hx + ' ' + hy;
return {
label: v.label,
bodyT: 'translate(0 ' + v.dy + ')',
headT: v.head,
hatT: v.hat,
tipD: v.tip,
pomX: v.pom[0], pomY: v.pom[1],
armL: arm(v.L[0], v.L[1], v.L[2] - v.dy, -1),
armR: arm(v.R[0], v.R[1], v.R[2] - v.dy, 1),
handL: 'translate(' + v.L[1] + ' ' + (v.L[2] - v.dy) + ') rotate(' + v.L[3] + ')',
handR: 'translate(' + v.R[1] + ' ' + (v.R[2] - v.dy) + ') rotate(' + v.R[3] + ') scale(-1 1)',
hatOn: v.hatOn, hatOff: v.hatOff, cloud: v.cloud,
handLOp: v.fist ? 0 : 1,
ratsBub: v.bubble ? 1 : 0,
pfOp: v.noPf ? 0 : 1,
fistOp: v.fist ? 1 : 0,
fistT: 'translate(' + v.L[1] + ' ' + (v.L[2] - v.dy) + ') rotate(-8)',
ratsText: v.rats, ratsSize: v.rs,
stress: v.stress, sigh: v.sigh, scribble: v.scribble
};
}
}
</script>
