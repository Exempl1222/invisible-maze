name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04
    # A newer push to the same branch or PR replaces an older test run. Runs on other refs never touch it.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    # Only main deploys. Pull requests get tested, never published.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    # One deploy at a time, and a deploy is never cancelled (a PR run used to cancel it).
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Collect the public site
        run: |
          mkdir _site
          cp -r index.html play daily assets _site/
          if [ -d src/game ] && ls src/game/*.js >/dev/null 2>&1; then
            mkdir -p _site/src && cp -r src/game _site/src/
            find _site/src -name '*.test.js' -delete
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
