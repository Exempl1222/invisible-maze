name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04
    # A newer push to the same branch or PR replaces an older test run. Runs on other refs never touch it.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    # Only main deploys. Pull requests get tested, never published.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    # One deploy at a time, and a deploy is never cancelled (a PR run used to cancel it).
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Collect the public site
        run: |
          mkdir _site
          cp -r index.html play daily assets _site/
          if [ -d src/game ] && ls src/game/*.js >/dev/null 2>&1; then
            mkdir -p _site/src && cp -r src/game _site/src/
            find _site/src -name '*.test.js' -delete
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  worker:
    # The stats Worker (worker/). Only main deploys, only after the tests pass, and only when Cloudflare
    # secrets exist and the Worker or what it bundles (the engine, the levels, the shared judge) changed.
    # Pull requests never reach this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    concurrency:
      group: worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No Cloudflare secrets set: skipping the Worker deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.go == 'true'
        with:
          fetch-depth: 2
      - name: Did the Worker or what it bundles change?
        id: changed
        if: steps.secrets.outputs.go == 'true'
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "No usable previous commit: deploying."
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- worker src/game assets/levels assets/js/daily/judge.js assets/js/daily/score.js assets/js/play/daily.js | grep -q .; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the Worker uses changed: skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.changed.outputs.go == 'true'
        with:
          node-version: 22
      - name: Create the tables (safe to repeat)
        if: steps.changed.outputs.go == 'true'
        working-directory: worker
        run: npx wrangler@3 d1 execute gnome-stats --remote --file schema.sql
      - name: Deploy the Worker
        if: steps.changed.outputs.go == 'true'
        working-directory: worker
        run: npx wrangler@3 deploy
