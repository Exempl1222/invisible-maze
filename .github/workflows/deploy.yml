name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04
    # A newer push to the same branch or PR replaces an older test run. Runs on other refs never touch it.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:e2e
        env:
          CI: "true"
      - name: Smoke test the stamped site
        # The deploy job's exact collect and stamp steps, served and loaded in a browser (home, daily, play).
        run: |
          tools/collect-site.sh _smoke_site "$GITHUB_SHA"
          SITE_DIR=_smoke_site npx playwright test -c playwright.site.config.js
        env:
          CI: "true"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            test-results-site/
          retention-days: 7

  deploy:
    # Only main deploys. Pull requests get tested, never published.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    # One deploy at a time, and a deploy is never cancelled (a PR run used to cancel it).
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Collect the public site
        # Shared with the test job's smoke test. Stamps ?v=<commit> on every own .js/.json/.css reference (cache busting).
        run: tools/collect-site.sh _site "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  worker:
    # The stats Worker (worker/). Only main deploys, only after the tests pass, and only when Cloudflare
    # secrets exist. It deploys on every push to main and every manual run (no change filter: the Worker bundles
    # the engine, the levels, the judge and config.js, and a filter once missed config.js). Pull requests never reach this job.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    concurrency:
      group: worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No Cloudflare secrets set: skipping the Worker deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.go == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.go == 'true'
        with:
          node-version: 22
      - name: Create the tables (safe to repeat)
        if: steps.secrets.outputs.go == 'true'
        working-directory: worker
        run: npx --yes wrangler@4.0.0 d1 execute gnome-stats --remote --file schema.sql
      - name: Deploy the Worker
        if: steps.secrets.outputs.go == 'true'
        working-directory: worker
        run: npx --yes wrangler@4.0.0 deploy
      - name: Set the bot-protection secret (only if TURNSTILE_SECRET is a non-empty GitHub secret)
        if: steps.secrets.outputs.go == 'true'
        working-directory: worker
        env:
          # Only this step sees the secret, not the wrangler steps above (their npm dependencies are not locked).
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          if [ -n "$TURNSTILE_SECRET" ]; then
            printf '%s' "$TURNSTILE_SECRET" | npx --yes wrangler@4.0.0 secret put TURNSTILE_SECRET
          else
            echo "No TURNSTILE_SECRET: bot protection stays off."
          fi
