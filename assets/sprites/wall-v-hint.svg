<svg xmlns="http://www.w3.org/2000/svg" class="gsg-wall" viewBox="0 0 24 72" width="24" height="72" role="img" aria-label="Wooden wall from a hint"><style>.gsg-wall .pc{transform-box:fill-box;transform-origin:50% 100%}.gsg-wall .rail{transform-box:fill-box;transform-origin:0% 50%}.gsg-wall .railv{transform-box:fill-box;transform-origin:50% 0%}.gsg-wall .burst,.gsg-wall .ribbon,.gsg-wall .spark{transform-box:fill-box;transform-origin:center}.gsg-wall .soil{animation:gsg-growX .3s ease-out both}.gsg-wall .stake{animation:gsg-rise .45s ease-out both}.gsg-wall .post{animation:gsg-post .4s ease-out both}.gsg-wall .rail{animation:gsg-growX .3s ease-out both}.gsg-wall .railv{animation:gsg-growY .3s ease-out both}.gsg-wall .burst{animation:gsg-burst .5s ease-out both}.gsg-wall .ribbon{animation:gsg-pop .35s ease-out both}.gsg-wall .spark{animation:gsg-spark 2.4s ease-in-out infinite}@keyframes gsg-growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes gsg-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes gsg-rise{0%{transform:translateY(34px)}70%{transform:translateY(-3px)}100%{transform:translateY(0)}}@keyframes gsg-post{0%{transform:scaleY(0)}65%{transform:scaleY(1.15)}100%{transform:scaleY(1)}}@keyframes gsg-pop{0%{transform:scale(0)}65%{transform:scale(1.2)}100%{transform:scale(1)}}@keyframes gsg-burst{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),-10px);opacity:0}}@keyframes gsg-spark{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){.gsg-wall *{animation:none!important}.gsg-wall .burst{opacity:0}}</style><g class="pc soil"><clipPath id="gsg-wv-hint-1"><path d="M5 10 C5 4 19 4 19 10 V66 C19 72 5 72 5 66 Z"/></clipPath><path d="M5 10 C5 4 19 4 19 10 V66 C19 72 5 72 5 66 Z" fill="#7a5230"/><g clip-path="url(#gsg-wv-hint-1)"><path d="M13 2 H24 V74 H13 Z" fill="#644225"/></g><path d="M5 10 C5 4 19 4 19 10 V66 C19 72 5 72 5 66 Z" fill="none" stroke="#3b2618" s