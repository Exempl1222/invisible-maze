<svg xmlns="http://www.w3.org/2000/svg" class="gsg-stump" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hollow stump teleporter, pair C"><style>.gsg-stump *{transform-box:view-box}.gsg-stump .swirl{transform-origin:0 0;animation:gsg-spin 3.2s linear infinite}.gsg-stump .rune{animation:gsg-glow 2.6s ease-in-out infinite;filter:drop-shadow(0 0 1.6px currentColor)}.gsg-stump .aura{transform-box:fill-box;transform-origin:center;animation:gsg-aura 2.6s ease-in-out infinite}.gsg-stump .beam{animation:gsg-beam 2.6s ease-in-out infinite}.gsg-stump .shroom{filter:drop-shadow(0 0 2.5px currentColor)}.gsg-stump .mote{transform-box:fill-box;animation:gsg-mote 2.8s ease-out infinite both}@keyframes gsg-spin{to{transform:rotate(360deg)}}@keyframes gsg-glow{0%,100%{opacity:.45}50%{opacity:1}}@keyframes gsg-aura{0%,100%{opacity:.18;transform:scale(.92)}50%{opacity:.4;transform:scale(1.05)}}@keyframes gsg-beam{0%,100%{opacity:.35}50%{opacity:.8}}@keyframes gsg-mote{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(var(--mx),-22px);opacity:0}}@media (prefers-reduced-motion:reduce){.gsg-stump *{animation:none!important}}</style><rect width="64" height="64" fill="#8cbf5a"/><path d="M24 14 l2 -5 l2 5 M42 38 l2 -5 l2 5 M10 54 l2 -5 l2 5 M54 52 l2 -4 l2 4 M28 40 l2 -4 l2 4" fill="none" stroke="#6e9e44" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="26" r="1.6" fill="#f2d35b"/><defs><radialGradient id="gsg-sc-hole" cx="50%" cy="55%" r="60%"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#ffcf5a"/><stop offset="1" stop-color="#140d0a"/></radialGradient><linearGradient id="gsg-sc-beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffcf5a" stop-opacity=".75"/><stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/></linearGradient><clipPath id="gsg-sc-hc"><ellipse cx="32" cy="26" rx="12" ry="4.4"/></clipPath></defs><ellipse class="aura" cx="32" cy="57" rx="29" ry="6.5" fill