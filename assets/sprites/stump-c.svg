inecap="round"/><ellipse cx="32" cy="26" rx="15" ry="5.6" fill="none" stroke="#b07a45" stroke-width="1"/><clipPath id="gsg-sc-2"><path d="M14 25 C14 21 18 19.5 22 20.5 C19.5 22.5 17 24.5 14.5 27.5 Z"/></clipPath><path d="M14 25 C14 21 18 19.5 22 20.5 C19.5 22.5 17 24.5 14.5 27.5 Z" fill="#86b84e"/><path d="M14 25 C14 21 18 19.5 22 20.5 C19.5 22.5 17 24.5 14.5 27.5 Z" fill="none" stroke="#3b2618" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="32" cy="26" rx="12" ry="4.4" fill="url(#gsg-sc-hole)"/><g clip-path="url(#gsg-sc-hc)"><g transform="translate(32 26.4) scale(1.25 .42)"><g class="swirl"><path d="M0 0 c2 -1 4 1 3 3 c-1 3 -5 3 -7 1 c-3 -3 -1 -8 3 -9 c4 -1 8 2 8 6" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".9"/><path d="M0 0 c2 -1 4 1 3 3 c-1 3 -5 3 -7 1 c-3 -3 -1 -8 3 -9 c4 -1 8 2 8 6" transform="rotate(180)" fill="none" stroke="#ffcf5a" stroke-width="1.4" stroke-linecap="round"/></g></g><ellipse cx="32" cy="27.8" rx="12" ry="4.4" fill="none" stroke="#140d0a" stroke-width="2.6" opacity=".75"/></g><ellipse cx="32" cy="26" rx="12" ry="4.4" fill="none" stroke="#3b2618" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path class="beam" d="M21 26 L25 -2 H39 L43 26 Z" fill="url(#gsg-sc-beam)"/><circle class="mote" cx="28" cy="24" r="1.2" fill="#ffcf5a" style="--mx:-3px;animation-delay:0s"/><circle class="mote" cx="34" cy="22" r="1.2" fill="#ffcf5a" style="--mx:3px;animation-delay:0.7s"/><circle class="mote" cx="31" cy="25" r="1.2" fill="#ffcf5a" style="--mx:-1px;animation-delay:1.4s"/><circle class="mote" cx="37" cy="24" r="1.2" fill="#ffcf5a" style="--mx:4px;animation-delay:2.1s"/></svg>
