<svg xmlns="http://www.w3.org/2000/svg" class="gsg-wall" viewBox="0 0 64 32" width="64" height="32" role="img" aria-label="Wooden wall from a hint"><style>.gsg-wall .pc{transform-box:fill-box;transform-origin:50% 100%}.gsg-wall .rail{transform-box:fill-box;transform-origin:0% 50%}.gsg-wall .railv{transform-box:fill-box;transform-origin:50% 0%}.gsg-wall .burst,.gsg-wall .ribbon,.gsg-wall .spark{transform-box:fill-box;transform-origin:center}.gsg-wall .soil{animation:gsg-growX .3s ease-out both}.gsg-wall .stake{animation:gsg-rise .45s ease-out both}.gsg-wall .post{animation:gsg-post .4s ease-out both}.gsg-wall .rail{animation:gsg-growX .3s ease-out both}.gsg-wall .railv{animation:gsg-growY .3s ease-out both}.gsg-wall .burst{animation:gsg-burst .5s ease-out both}.gsg-wall .ribbon{animation:gsg-pop .35s ease-out both}.gsg-wall .spark{animation:gsg-spark 2.4s ease-in-out infinite}@keyframes gsg-growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes gsg-growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes gsg-rise{0%{transform:translateY(34px)}70%{transform:translateY(-3px)}100%{transform:translateY(0)}}@keyframes gsg-post{0%{transform:scaleY(0)}65%{transform:scaleY(1.15)}100%{transform:scaleY(1)}}@keyframes gsg-pop{0%{transform:scale(0)}65%{transform:scale(1.2)}100%{transform:scale(1)}}@keyframes gsg-burst{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),-10px);opacity:0}}@keyframes gsg-spark{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){.gsg-wall *{animation:none!important}.gsg-wall .burst{opacity:0}}</style><defs><clipPath id="gsg-wh-hint-ground"><rect x="-2" y="-30" width="68" height="59"/></clipPath></defs><g class="pc soil"><clipPath id="gsg-wh-hint-1"><path d="M2 28 C10 25 54 25 62 28 C63 30 61 32 58 32 H6 C3 32 1 30 2 28 Z"/></clipPath><path d="M2 28 C10 25 54 25 62 28 C63 30 61 32 58 32 H6 C3 32 1 30 2 28 Z" fill="#7a5230"/><path d="M2 28 C10 25 54 25